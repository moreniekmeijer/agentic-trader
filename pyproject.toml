[project]
name = "trading-agent"
version = "0.1.0"
description = "Agentic trading system with Alpaca"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "apscheduler",
    "alpaca-py",
    "pandas",
    "pytz",
    "yfinance",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

# ------------------------
# RUFF
# ------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, flakes, imports
ignore = []

[tool.ruff.format]
quote-style = "double"

# ------------------------
# PYTEST
# ------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ------------------------
# TYPE CHECKING (ty)
# ------------------------
[tool.ty.src]
include = ["src"]
exclude = []